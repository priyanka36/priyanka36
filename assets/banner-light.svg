<style>
.pulse { transform-box: fill-box; transform-origin: center; animation: p 4s ease-in-out infinite; }
@keyframes p { 0%,100% { transform: scale(1); opacity: .95 } 50% { transform: scale(2); opacity: .3 } }
.in { animation: f 1s ease-out backwards; }
.d1 { animation-delay: .2s } .d2 { animation-delay: .6s } .d3 { animation-delay: 1s }
@keyframes f { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.flow { stroke-dasharray: 6 10; animation: d 6s linear infinite; }
@keyframes d { to { stroke-dashoffset: -160 } }
</style>
